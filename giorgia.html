<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buon compleanno Giorgia!</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }
    img {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain; /* mostra tutta la foto senza tagliarla */
    }
  </style>
</head>
<body>
  <img id="photo" alt="Foto a tutto schermo">

  <script>
    // INSERISCI QUI IL PERCORSO DELLA TUA FOTO:
    const IMAGE_PATH = "giorgia/giorgia.jpg";

    document.getElementById("photo").src = IMAGE_PATH;
  </script>
</body>
</html>
